 NHE19_UI_DECISION:0 "多余辅助庄园自动整理，建筑按原生拆除规则返还；世族庄园保留。"
 nhe19_manage_decision:0 "管理官职庄园"
 nhe19_manage_decision_desc:0 "查看本人辅助庄园。多余载体自动将兵士转至主头衔、资源转至默认住所，再拆除建筑并按原生规则返还。原生世族等住所完整保留。"
 nhe19_manage_decision_confirm:0 "打开管理"
 nhe19_repair_decision:0 "检查官职住所交接"
 nhe19_repair_decision_desc:0 "检查已注册官职的交接，并为大草原内有领地的宫帐统治者补建缺失的辅助庄园，自动整理重复载体。首次用于旧档时，把本Mod尚处于初始免除档的牧群税补为正常；之后不重置所选税率。"
 nhe19_repair_decision_confirm:0 "进行结构检查"
 nhe19_redeem_decision:0 "兑换多余官职载体"
 nhe19_redeem_decision_desc:0 "兑换所选多余实验载体，将牧群合并到保留住所，并领取建筑残值。带兵士或仍有补给的载体保留。每职最后载体及所有原生住所禁兑。免费主楼不计残值，其余每座已建建筑50金；部分合并时保留来源且不发钱，可解除收据后继续。"
 nhe19_redeem_decision_confirm:0 "确认兑换所选多余载体"
 nhe19_settle_decision:0 "领取已销毁载体的残值"
 nhe19_settle_decision_desc:0 "仅处理已确认原载体销毁、住所退出持有列表且尚未开始支付的阶段3收据。引擎保留的历史记录不影响结算。不会重放合并。"
 nhe19_settle_decision_confirm:0 "领取一次残值"
 nhe19_verify_decision:0 "核验待完成的载体销毁"
 nhe19_verify_decision_desc:0 "仅在已经发出销毁的阶段2，核验同一来源头衔已销毁、无人持有且无附属兵士后领取残值。不会再次移动牧群或再次销毁。历史对象保留不等于仍持有住所。"
 nhe19_verify_decision_confirm:0 "核验原载体销毁结果"
 nhe19_archive_decision:0 "归档已完成兑换收据"
 nhe19_archive_decision_desc:0 "仅清理已支付阶段5的选择和临时收据，允许下一次兑换；不会再次发钱。"
 nhe19_archive_decision_confirm:0 "归档已完成收据"
 nhe19_pause_decision:0 "暂停实验住所维护"
 nhe19_pause_decision_desc:0 "停止本Mod的结构创建、交接和兑换；保留所有已存在的原生对象。"
 nhe19_pause_decision_confirm:0 "暂停维护"
 nhe19_resume_decision:0 "恢复实验住所维护"
 nhe19_resume_decision_desc:0 "恢复官职交接、缺失辅助庄园补建和多余载体自动整理。"
 nhe19_resume_decision_confirm:0 "恢复维护"
 nhe19_manage_decision_tooltip:0 "独立实验入口；以作用域记录和原生存档核验结果。"
 nhe19_repair_decision_tooltip:0 "独立实验入口；以作用域记录和原生存档核验结果。"
 nhe19_redeem_decision_tooltip:0 "选择有来源证明、无所属兵士且补给为零的多余实验载体；有牧群时须指定不同的本人官职住所。每职最后住所和原生住所保留。"
 nhe19_settle_decision_tooltip:0 "仅已确认销毁且尚未开始付款的阶段3，可以领取一次残值。"
 nhe19_verify_decision_tooltip:0 "仅本次已发出销毁、原载体已销毁且无人持有的阶段2，才可确认领取。"
 nhe19_archive_decision_tooltip:0 "仅已完成付款的阶段5可以归档；不会重复发钱。"
 nhe19_pause_decision_tooltip:0 "独立实验入口；以作用域记录和原生存档核验结果。"
 nhe19_resume_decision_tooltip:0 "独立实验入口；以作用域记录和原生存档核验结果。"
 NHE19_CLASSIFY:0 "核对并自动整理"
 NHE19_SET_ACTIVE:0 "设为当前官职住所"
 NHE19_OPEN_ACTIVE:0 "打开当前官职住所"
 NHE19_UI_ACTIVE:0 "当前官职住所：[ROOT.Char.MakeScope.Var('nhe19_active_aux').Title.GetName]"
 NHE19_UI_ACTIVE_NONE:0 "当前官职住所：暂无有效官职住所"
 NHE19_UI_REQUIRED:0 "当前保留的辅助庄园。"
 NHE19_UI_EXTRA:0 "多余辅助庄园：等待自动整理，未转出的资产仍保留。"
 NHE19_UI_PROTECTED:0 "来源或配对尚未确认：保留，不参与兑换。"
 nhe19_release_decision:0 "解除未销毁的兑换收据"
 nhe19_release_decision_desc:0 "仅解除已核验的部分合并阶段6或原对象仍在的销毁前阶段2；须确认同一载体和住所仍由你持有。不撤销已发生的原生合并，不发金币；可重新选定剩余资源继续。阶段1或4的未知中断须先核对，不能盲重放。"
 nhe19_release_decision_confirm:0 "保留原对象并重新选择"
 nhe19_release_decision_tooltip:0 "只允许已核验阶段6或销毁前阶段2，须确认原载体和原住所仍由本人持有。"
 nhe19_finish_decision:0 "继续处理已合并的多余载体"
 nhe19_finish_decision_desc:0 "继续处理已核验牧群合并的载体。来源牧群及补给为零、没有所属兵士，且最后住所保护仍成立时，完成兑换并领取一次残值。若牧群重新增长，可解除未销毁收据后重新选择。"
 nhe19_finish_decision_confirm:0 "核对原对象并继续"
 nhe19_finish_decision_tooltip:0 "仅继续已合并的阶段2；来源牧群与补给为零、无所属兵士，且原载体及住所仍由本人持有。"

